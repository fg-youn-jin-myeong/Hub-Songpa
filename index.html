<div id="modal" class="modal" onclick="if(event.target===this)closeM()"><div class="modalbox"><div class="mhead"><b id="mtitle"></b><button onclick="closeM()">닫기</button></div><div id="detail" class="detail"></div></div></div>
<script src="data.js"></script><script src="showroom.js"></script><script src="showroom_photos.js"></script><script>
const D=window.FURSYS_DATA,ALL=[...D.sets,...D.units],REF=[],SHOW=window.FURSYS_SHOWROOM||[];window._VARIANTS=ALL;let group='',cart=[],refSel='전체',showSec='';const SHOWCODES=new Set(SHOW.map(x=>x.code.toUpperCase()));
const won=n=>'₩'+Math.round(Number(n||0)).toLocaleString('ko-KR'), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function showView(v){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id===v));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('on',x.dataset.view===v));window.scrollTo(0,0)}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>showView(b.dataset.view));
function searchText(x){return[x.group,x.series,x.code,x.name,x.combo].join(' ').toLowerCase()}
function groupedRows(arr){let m=new Map();arr.forEach(x=>{let k=x.t+'|'+x.code;if(!m.has(k))m.set(k,[]);m.get(k).push(x)});return [...m.values()].map(a=>{let prices=[...new Set(a.map(x=>x.retail).filter(Boolean))].sort((a,b)=>a-b);return {base:a[0],variants:a,price:prices.length>1?won(prices[0])+' ~':won(prices[0]||0)}})}
function run(){let qq=q.value.trim().toLowerCase(),terms=qq?qq.split(/\s+/):[];let a=ALL.filter(x=>(!group||(x.group||'').toUpperCase().includes(group))&&(!terms.length||terms.every(t=>searchText(x).includes(t))));let g=groupedRows(a);g.sort((a,b)=>(a.base.series||'').localeCompare(b.base.series||'')||(a.base.code||'').localeCompare(b.base.code||''));sum.textContent=`${g.length.toLocaleString()}개 제품코드 · 색상 중복 제외 · 최대 300개 표시`;results.innerHTML=g.slice(0,300).map(z=>`<div class="row click productResult" data-series="${esc(z.base.series)}" data-code="${esc(z.base.code)}"><span>${esc(z.base.series)||'-'}</span><span class="code">${esc(z.base.code)}</span><span>${esc(z.base.name)||'-'} <span class="muted">· 색상 ${z.variants.length}종</span>${SHOWCODES.has(String(z.base.code).toUpperCase())?`<br><span style="display:inline-block;margin-top:5px;padding:4px 7px;border-radius:999px;background:#111;color:#fff;font-size:10px">쇼룸 전시 · ${esc(SHOW.find(a=>a.code.toUpperCase()===String(z.base.code).toUpperCase()).location)}</span>`:''}</span><span class="price">${z.price}</span></div>`).join('')||'<div class="summary">품목이 없습니다.</div>'}

  const row=e.target.closest('.productResult');

function openSeries(series,focus){
 let items=ALL.filter(x=>x.series===series);
 if(!items.length && focus) items=ALL.filter(x=>String(x.code).toUpperCase()===String(focus).toUpperCase());
 if(!items.length){alert('연결된 판매 품목을 찾지 못했습니다.');return}
 let actualSeries=items[0].series||series;
 let focusShow=SHOW.find(z=>focus && String(z.code).toUpperCase()===String(focus).toUpperCase());

 let byCode=new Map(); items.forEach((x)=>{let k=x.code;if(!byCode.has(k))byCode.set(k,[]);byCode.get(k).push(x)});
 let codeBlocks=[...byCode.entries()].map(([code,vars])=>{
   let prices=vars.map(v=>+v.retail||0).filter(Boolean), mn=Math.min(...prices),mx=Math.max(...prices);

    ${vars.map(v=>{let idx=ALL.indexOf(v);return `<div class="srow"><b>${esc(v.code)}</b><span>${esc(v.name)}</span><span>${esc(v.color)}</span><b>${won(v.retail)}</b><button onclick="addByIndex(${idx})">견적 담기</button></div>`}).join('')}
   </div>`
 }).join('');
 mtitle.textContent=actualSeries||'제품 상세';
 detail.innerHTML=`<h2>${esc(actualSeries||'제품')} ${focusShow?`<span class="showbadge">쇼룸 No.${esc(focusShow.location)}</span>`:''}</h2><p class="muted">카탈로그와 색상별 실제 판매 품목을 확인하고 견적함에 담을 수 있습니다.</p>
 <h3>CATALOG</h3><div class="catalog">${pages.map(p=>`<img loading="lazy" src="p${p}.jpg">`).join('')||'<p class="muted">연결된 카탈로그 페이지가 없습니다.</p>'}</div>

function zonePhotos(section,loc){
 let key=cleanLoc(loc);
 return SP.filter(p=>p.sheet===section && cleanLoc(p.location)===key);
}
function selectZone(n){selectedZone=String(n);renderHotspots();let p=ZPOS[selectedZone];activeZoneLabel.textContent='전시 위치 No.'+selectedZone;zoneGlow.style.display='none';renderSelectedZone()}
function renderSelectedZone(){let all=SHOW.filter(x=>cleanLoc(x.location)===selectedZone);if(showSec)all=all.filter(x=>x.section===showSec);if(!all.length){showSum.textContent=`No.${selectedZone}`;zoneCards.innerHTML='<div class="summary">이 번호에 연결된 전시 품목이 없습니다.</div>';return}
let first=all[0],series=[...new Set(all.map(x=>x.series).filter(Boolean))],pics=zonePhotos(first.section,first.location),primary=all.slice(0,6),rest=all.slice(6);
showSum.textContent=`No.${selectedZone} · ${first.section} · ${all.length}개 품목 · 품목을 클릭하면 견적함에 추가됩니다`;
zoneCards.innerHTML=`<div class="zoneHero"><div class="zoneHeroHead"><div><span class="showbadge">${esc(first.section)}</span><h2>${esc(series.slice(0,3).join(' · ')||'전시 구성')}</h2><span class="muted">이 위치에서 직접 확인할 수 있습니다.</span></div><div class="bigNo">No.${selectedZone}</div></div>${pics.length?`<div class="zonePhotos big">${pics.map(p=>`<img loading="lazy" src="${p.src}">`).join('')}</div>`:`<div style="margin:0 15px 15px;padding:20px;border:1px dashed #ccc;border-radius:10px;color:#999;text-align:center">이 전시 위치에 연결된 실물사진이 없습니다.</div>`}<div class="zoneItems">${primary.map(itemRow).join('')}</div>${rest.length?`<button class="moreBtn" onclick="document.getElementById('moreItems').classList.toggle('open');this.textContent=this.textContent.includes('전체')?'접기':'전체 ${all.length}개 품목 보기'">전체 ${all.length}개 품목 보기</button><div id="moreItems" class="zoneItems hiddenItems">${rest.map(itemRow).join('')}</div>`:''}</div>`}
function addShowroomItem(y){
 if(!y)return;
 let code=String(y.code||'').trim();
 let retail=Number(y.retail||0);
 if(!retail){alert('이 전시품목은 소비자가가 없어 견적함에 담을 수 없습니다.');return}
 let x={
   t:'showroom',
   group:y.section||'쇼룸',
   series:y.series||'',
   code:code||'-',
   color:y.color||'',
   combo:'',
   name:y.name||'쇼룸 전시품목',
   retail:retail,
   pages:[]
 };
 add(x);
}
function itemRow(y){
 let canAdd=Number(y.retail||0)>0;
 return `<div class="zitem showroomItem" title="${canAdd?'클릭하여 견적함에 추가':'소비자가 정보 없음'}" onclick='addShowroomItem(${JSON.stringify(y)})'>
   <b>${esc(y.code||'-')}</b>
   <span>${esc(y.name)}<br><span class="muted">${esc(y.color)} ${y.note?'· '+esc(y.note):''}</span></span>
   <b class="price">${canAdd?won(y.retail):'-'}</b>
 </div>`;
}
function renderShowroom(){renderSelectedZone()}
document.querySelectorAll('#showPills .pill').forEach(b=>b.onclick=()=>{showSec=b.dataset.s||'';document.querySelectorAll('#showPills .pill').forEach(x=>x.classList.toggle('on',(x.dataset.s||'')===showSec));let valid=SHOW.filter(x=>!showSec||x.section===showSec).map(x=>cleanLoc(x.location));if(!valid.includes(selectedZone)&&valid.length)selectedZone=valid[0];renderHotspots();selectZone(selectedZone)});

function closeM(){modal.style.display='none'}run();drawCart();renderHotspots();selectZone('1');
</script></body></html>
